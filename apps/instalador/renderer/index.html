<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>God of War Collection</title>
<link rel="stylesheet" href="instalador.css">
</head>
<body>
<div class="fundo" aria-hidden="true"></div>
<div class="arrasta" aria-hidden="true"></div>
<button class="xis" data-j="fechar" aria-label="Fechar"></button>
<button class="traco" data-j="min" aria-label="Minimizar"></button>

<main class="tela">
  <img class="logo" src="../arte/logo.png" alt="God of War Collection">

  <!-- menu inicial -->
  <section class="pag" data-p="0">
    <nav class="menu">
      <div class="item" data-acao="comecar" data-k="menu.instalar"></div>
      <div class="item op-menu" data-op="idioma"><span class="rot" data-k="menu.idioma"></span><span class="val"></span></div>
      <div class="item" data-acao="fechar" data-k="menu.sair"></div>
    </nav>
    <p class="leve" data-k="nota.req" data-tam="13"></p>
  </section>

  <!-- licença -->
  <section class="pag" data-p="1">
    <h1 class="tit" data-k="lic.titulo" data-tam="30"></h1>
    <div class="tabua">
      <div class="item linha" data-acao="pkg">
        <span class="rot" data-k="lic.pkg" data-tam="18"></span><span class="val" id="v-pkg" data-tam="16"></span>
        <small class="arq" id="a-pkg" data-kp="lic.pkg_dica"></small>
        <div class="magia" id="b-pkg" hidden><div></div></div>
      </div>
      <div class="item linha" data-acao="rif">
        <span class="rot" data-k="lic.rif" data-tam="18"></span><span class="val" id="v-rif" data-tam="16"></span>
        <small class="arq" id="a-rif" data-kp="lic.rif_dica"></small>
      </div>
      <p class="aviso" id="aviso-lic"></p>
    </div>
    <nav class="menu baixo">
      <div class="item" data-acao="lic-ok" id="i-continuar" data-k="btn.continuar"></div>
      <div class="item" data-acao="voltar" data-k="btn.voltar"></div>
    </nav>
  </section>

  <!-- destino -->
  <section class="pag" data-p="2">
    <h1 class="tit" data-k="dest.titulo" data-tam="30"></h1>
    <div class="tabua">
      <div class="item linha" data-acao="pasta">
        <span class="rot" data-k="dest.pasta" data-tam="18"></span><span class="val" data-k="dest.mudar" data-tam="16"></span>
        <small class="arq" id="a-pasta"></small>
      </div>
      <div class="item linha op" data-op="desktop"><span class="rot" data-k="dest.desktop" data-tam="18"></span><span class="val"></span></div>
      <div class="item linha op" data-op="menu"><span class="rot" data-k="dest.menu" data-tam="18"></span><span class="val"></span></div>
      <div class="item linha op" data-op="registro"><span class="rot" data-k="dest.registro" data-tam="18"></span><span class="val"></span></div>
      <p class="aviso" id="aviso-esp"></p>
    </div>
    <nav class="menu baixo">
      <div class="item" data-acao="instalar" id="i-instalar" data-k="btn.instalar"></div>
      <div class="item" data-acao="voltar" data-k="btn.voltar"></div>
    </nav>
  </section>

  <!-- instalando: a haste dourada do HUD do GoW2 acende conforme os arquivos chegam -->
  <section class="pag" data-p="3">
    <h1 class="tit" data-k="inst.titulo" data-tam="30"></h1>
    <div class="tabua progresso">
      <div class="prog-topo">
        <div class="pct" id="i-pct" data-tam="46"></div>
        <div class="prog-gb" id="i-gb" data-tam="16"></div>
      </div>
      <div class="haste" id="haste">
        <div class="haste-apagada"></div>
        <div class="haste-acesa" id="haste-acesa"><div class="brilho"></div></div>
        <div class="faisca" id="faisca"></div>
      </div>
      <div class="prog-dados">
        <div><span class="lbl" data-k="inst.vel" data-tam="12"></span><span class="v" id="i-vel" data-tam="17"></span></div>
        <div><span class="lbl" data-k="inst.resta" data-tam="12"></span><span class="v" id="i-resta" data-tam="17"></span></div>
        <div><span class="lbl" data-k="inst.arqs" data-tam="12"></span><span class="v" id="i-arqs" data-tam="17"></span></div>
      </div>
      <small class="arq" id="i-arq">&nbsp;</small>
    </div>
    <nav class="menu baixo">
      <div class="item" data-acao="cancelar" data-k="btn.cancelar"></div>
    </nav>
  </section>

  <!-- pronto -->
  <section class="pag" data-p="4">
    <h1 class="tit" data-k="pronto.titulo" data-tam="30"></h1>
    <p class="corpo" id="pronto-txt"></p>
    <nav class="menu">
      <div class="item" data-acao="jogar" data-k="btn.jogar"></div>
      <div class="item" data-acao="pasta-abrir" data-k="btn.abrir"></div>
      <div class="item" data-acao="fechar" data-k="menu.sair"></div>
    </nav>
  </section>

  <!-- erro -->
  <section class="pag" data-p="erro">
    <h1 class="tit" data-k="erro.titulo" data-tam="30"></h1>
    <p class="corpo" id="erro-txt"></p>
    <nav class="menu"><div class="item" data-acao="fechar" data-k="menu.sair"></div></nav>
  </section>
</main>

<footer class="dicas" id="dicas" aria-hidden="true"></footer>

<!-- pergunta (cancelar) -->
<div class="pergunta" id="pergunta" hidden>
  <div class="tabua">
    <p class="perg-txt" id="perg-txt" data-tam="18"></p>
    <nav class="menu linha-menu">
      <div class="item" data-resp="1" data-k="op.sim"></div>
      <div class="item" data-resp="0" data-k="op.nao"></div>
    </nav>
  </div>
</div>

<script src="../arte/fonte_meta.js"></script>
<script src="fonte.js"></script>
<script src="textos.js"></script>
<script src="instalador.js"></script>
</body>
</html>
